name: publish-nuget

# Publishes RepoQL.Aspire to NuGet.org.
# Triggers: pushing a version tag (v0.1.0) or manual dispatch.
# The csproj <Version> is the single source of truth; a tag that
# disagrees with it fails loudly instead of publishing a mismatch.
# Requires the NUGET_API_KEY repository secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build RepoQL.Aspire.slnx --configuration Release

      - name: Test
        run: dotnet run --project tests/RepoQL.Aspire.Tests --configuration Release --no-build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/RepoQL.Aspire/RepoQL.Aspire.csproj)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match <Version>$version</Version> in RepoQL.Aspire.csproj" >&2
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/RepoQL.Aspire --configuration Release --no-build --output artifacts/packages

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
